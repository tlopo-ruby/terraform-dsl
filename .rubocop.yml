AllCops:
  TargetRubyVersion: 2.7
  NewCops: enable
  SuggestExtensions: false

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Exclude:
    - '*.gemspec'
    - test/**/*

Metrics/MethodLength:
  Exclude:
    - test/**/*

Style/ClassAndModuleChildren:
  Exclude:
    - test/**/*

Metrics/AbcSize:
  Max: 20

Metrics:
  Exclude:
    - test/**/*
